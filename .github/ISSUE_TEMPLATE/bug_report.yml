name: 🐞 Сообщение об ошибке
description: Что-то работает неправильно
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Не прикладывайте настоящие файлы `.nox`, CSV с паролями, мастер-пароль,
        ключ восстановления или скриншоты с реальными секретами.**
        Для проверки используйте тестовое хранилище и вымышленные данные.
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло?
      description: Коротко опишите проблему и что вы ожидали вместо этого.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить?
      description: Пошагово, начиная с открытия приложения.
      placeholder: |
        1. Открыть…
        2. Нажать…
        3. Увидеть…
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Версия NOX Vault
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и Android
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Дополнительные детали или текст ошибки
      description: Перед отправкой удалите из текста любые реальные логины, пароли и имена ваших файлов с секретами.
    validations:
      required: false
