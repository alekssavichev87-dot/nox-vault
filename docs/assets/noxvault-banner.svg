<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">NOX Vault</title>
  <desc id="desc">Офлайн-хранилище секретов для Android. AES-256-GCM, Argon2id, Jetpack Compose и Android Autofill.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a10"/>
      <stop offset="0.58" stop-color="#14121f"/>
      <stop offset="1" stop-color="#21173a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" rx="36" fill="url(#bg)"/>
  <circle cx="240" cy="210" r="235" fill="url(#glow)"/>
  <circle cx="1120" cy="35" r="190" fill="url(#glow)" opacity="0.55"/>
  <rect x="1" y="1" width="1278" height="418" rx="35" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Shield -->
  <path d="M250 58 L372 103 V202 C372 287 321 336 250 362 C179 336 128 287 128 202 V103 Z"
        fill="url(#shield)" fill-opacity="0.2" stroke="url(#shield)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Lock -->
  <path d="M204 190 v-28 a46 46 0 0 1 92 0 v28" fill="none" stroke="#f5f3ff" stroke-width="17" stroke-linecap="round"/>
  <rect x="178" y="183" width="144" height="112" rx="22" fill="#f5f3ff"/>
  <circle cx="250" cy="225" r="15" fill="#171321"/>
  <rect x="241" y="230" width="18" height="38" rx="9" fill="#171321"/>

  <text x="447" y="166" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="2" fill="#ffffff">NOX VAULT</text>
  <text x="452" y="224" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="500" fill="#d8d2e8">Офлайн-хранилище секретов для Android</text>
  <text x="452" y="282" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#b7a6ff">AES-256-GCM  •  Argon2id  •  Jetpack Compose  •  Android Autofill</text>
  <text x="452" y="329" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" fill="#918aa8">Без интернета, аккаунтов, рекламы и телеметрии</text>
</svg>
